<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>تطبيق المواهب</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-title" content="المواهب">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Talent Academy palette: charcoal black + academy orange.
   Layout: phone-first app shell — club header, swappable screens, bottom tab bar (tabs change with the signed-in role) */
:root{
  --orange:#e07b24; --orange-deep:#b35a14; --red:#1d1d1d; --on-accent:#ffffff;
  --bg:#f6f4f1; --surface:#ffffff; --fg:#1a1714; --muted:#625a52; --line:#e5ded4; --soft:#efeae3;
  --ok:#2e7d4f; --warn:#b36b00; --bad:#ad2323;
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1d1b19; --fg:#f3efe9; --muted:#b0a89e; --line:#34302b; --soft:#262320; --red:#2b2825;
  --ok:#5fc48a; --warn:#f0a83a; --bad:#ff7a6e; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110; --surface:#1d1b19; --fg:#f3efe9; --muted:#b0a89e; --line:#34302b; --soft:#262320; --red:#2b2825;
  --ok:#5fc48a; --warn:#f0a83a; --bad:#ff7a6e; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.banner{background:var(--fg);color:var(--bg);font-size:12px;text-align:center}
.banner .wrap{padding-block:7px}

header.top{background:linear-gradient(160deg,#232120 0%,#0d0d0d 100%);border-bottom:4px solid var(--orange);color:var(--on-accent);position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:18px solid rgba(224,123,36,.22)}
.top .wrap{padding-block:16px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.crest-img{width:54px;height:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.crest{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-family:var(--display);font-size:26px;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.top h1{font-size:23px}
.top p{margin:0;opacity:.92;font-size:13px}

main{padding-block:18px}
section.screen{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.label{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{font-variant-numeric:tabular-nums}
.who{font-size:12px;font-weight:800;color:var(--red);margin:0}

.hero{background:var(--red);color:var(--on-accent);border:none;position:relative;overflow:hidden}
.hero h2{font-size:22px}
.hero p{margin:6px 0 14px;opacity:.94}
.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.13;pointer-events:none}
.btn{border:none;border-radius:99px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px}
.btn-white{background:var(--orange);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}

.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-family:var(--display);font-weight:400;color:var(--orange);line-height:1.2}

.session{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.session:first-child{border-top:none}
.day{text-align:center;background:var(--soft);border-radius:12px;padding:6px 0;line-height:1.2}
.day b{display:block;font-size:18px;font-family:var(--display);font-weight:400;color:var(--red)}
.day span{font-size:11px;color:var(--muted)}
.chip{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:700;white-space:nowrap;display:inline-block}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.match{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}

.player-head{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none}
.skill{display:grid;grid-template-columns:84px 1fr 30px;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(270deg,var(--orange),var(--red));border-radius:99px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.dot.p{background:var(--ok)} .dot.a{background:var(--bad)} .dot.l{background:var(--warn)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle}
.notif{display:flex;gap:10px;align-items:flex-start;padding-block:9px;border-top:1px solid var(--line);font-size:14px}
.notif:first-child{border-top:none}
.notif .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}

.att{display:flex;justify-content:space-between;align-items:center;padding-block:10px;border-top:1px solid var(--line);gap:10px}
.att:first-child{border-top:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{border:none;background:transparent;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].p{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].a{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].l{background:var(--warn);color:#fff}
.rate{display:grid;grid-template-columns:84px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.rate input{width:100%;accent-color:var(--orange)}

.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:none}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.list-row:first-child{border-top:none}
.list-row > div{min-width:0}

.branch{display:flex;flex-direction:column;gap:10px}
.branch .row a{flex:1;min-width:120px}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}

form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%}
.field input:focus,.field select:focus{border-color:var(--orange);outline:none}
.toast{background:color-mix(in srgb,var(--ok) 13%,var(--surface));border:1px solid var(--ok);color:var(--fg);border-radius:12px;padding:12px;font-size:14px}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid var(--bad);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14px}

.socials{display:flex;gap:8px;flex-wrap:wrap}
.socials a{flex:1 1 28%;text-align:center;padding:10px;border-radius:12px;background:var(--soft);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:13px}

nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(var(--tabs,4),1fr);padding-block:6px}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted);font-size:11px;font-weight:700}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--orange)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.sessionbar{background:var(--soft);border-bottom:1px solid var(--line);font-size:13px}
.sessionbar .wrap{padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sessionbar b{font-weight:800}
.role-pill{font-size:11px;font-weight:800;border-radius:99px;padding:1px 9px;margin-inline-start:6px;background:var(--orange);color:#fff;vertical-align:middle}
.role-pill.coach{background:var(--ok)} .role-pill.admin{background:var(--red)} .role-pill.guest{background:var(--muted)}
.linkbtn{background:none;border:none;color:var(--red);font-weight:800;cursor:pointer;padding:0;font-size:13px;text-decoration:underline}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.acct:hover{border-color:var(--orange)}
.acct .label{display:block}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp span{width:44px;height:52px;border:1.5px solid var(--orange);border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--bg)}
.perm{display:flex;flex-direction:column;gap:6px;font-size:14px;margin:0;padding:0;list-style:none}
.perm li{display:flex;gap:8px;align-items:flex-start}
.perm .y{color:var(--ok);font-weight:800;flex:none} .perm .n{color:var(--bad);font-weight:800;flex:none}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kids button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
.kids button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.transfer{background:color-mix(in srgb,var(--orange) 9%,var(--surface));border:1.5px solid var(--orange);border-radius:14px;padding:14px;margin-block:8px;display:flex;flex-direction:column;gap:10px}
.from-to{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-size:13px}
.from-to div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.from-to .arrow{font-size:20px;color:var(--orange);font-weight:800}
.hist{border-inline-start:3px solid var(--orange);padding-inline-start:10px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.search{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;width:100%}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.5}
.bub .label{display:block;font-size:11px;margin-top:2px}
.bub.me{align-self:flex-start;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.bub.me .label{color:rgba(255,255,255,.85)}
.bub.them{align-self:flex-end;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center}
.composer,form.composer{display:flex;flex-direction:row;gap:8px;margin-top:10px;align-items:center}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px}
textarea{font:inherit;color:inherit;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%;min-height:80px;resize:vertical}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:0 4px;margin-inline-start:3px}
nav.tabs button{position:relative}
nav.tabs .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 22px)}
.thread{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:none;border-top:1px solid var(--line);padding:11px 0;cursor:pointer}
.thread:first-child{border-top:none}
.thread > span:first-child{min-width:0}
.ellip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.ticket{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.ticket:first-child{border-top:none}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:2px}
.method[aria-pressed="true"]{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--surface))}
.method strong{font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.item:first-child{border-top:none}
.item label{display:flex;gap:8px;align-items:center;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;padding-top:10px;border-top:2px solid var(--fg)}
.iban{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.5px;user-select:all}
.code{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--red);text-align:center;direction:ltr}
.mtile{display:flex;flex-direction:column;gap:2px}
.mtile b{font-size:20px;font-family:var(--display);font-weight:400;line-height:1.2}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:20px;background:color-mix(in srgb,var(--orange) 18%,transparent)}
.medal.gold{background:linear-gradient(145deg,#f3c44b,#d48d1c);box-shadow:0 0 0 3px color-mix(in srgb,#f3c44b 30%,transparent)}
.honor{display:flex;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.honor:first-child{border-top:none}
.honor > div{min-width:0;flex:1}
.potm{background:linear-gradient(160deg,var(--orange) 0%,var(--orange-deep) 100%);color:#fff;border:none}
.potm .label{color:rgba(255,255,255,.88)}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.lock svg{width:22px;height:22px;flex:none;stroke:var(--orange);fill:none;stroke-width:2}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>

// ================= Render + events =================
function render(){
  $('app').innerHTML = (S[tab] || S.home)();
  bind();
}
function bind(){
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  $('app').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));

  // login
  $('app').querySelectorAll('[data-acct]').forEach(b => b.onclick = () => { const a = ACCOUNTS[+b.dataset.acct]; pendingLogin = {who:a.who, phone:phoneOf(a.who)}; render(); });
  on('loginGo','click', () => {
    const ph = toLatin($('loginPhone').value);
    let who = null;
    if (DB.parents[ph]) who = {type:'parent', phone:ph};
    // a number registered as both coach and parent gets a chooser after the code
    const c = DB.coaches.find(c => c.phone === ph); if (c) who = {type:'coach', id:c.id};
    if (ph === '0500000999') who = {type:'admin'};
    if (!who) { $('loginErr').textContent = /^05\d{8}$/.test(ph) ? 'هذا الرقم مو مسجل عند النادي. إذا ابنك مسجل، تواصل مع الفرع يحدّث رقمك.' : 'اكتب رقم جوال صحيح يبدأ بـ 05.'; $('loginErr').hidden = false; return; }
    pendingLogin = {who, phone:ph}; render();
  });
  on('otpGo','click', () => {
    const ph = pendingLogin.phone, roles = rolesFor(ph);
    if (roles.length > 1) { pendingLogin.choose = true; render(); return; }
    const w = {...pendingLogin.who, phone:ph}; pendingLogin = null; login(w);
  });
  $('app').querySelectorAll('[data-role-pick]').forEach(b => b.onclick = () => { const r = rolesFor(pendingLogin.phone).find(x => x.type === b.dataset.rolePick); pendingLogin = null; login(r); });
  on('otpBack','click', () => { pendingLogin = null; render(); });
  on('logout','click', () => { me = {type:'guest'}; go('home'); });

  // register
  on('regForm','submit', e => {
    e.preventDefault();
    const v = id => $(id).value.trim(); let msg = '';
    if(!v('f-name')) msg = 'اكتب اسم اللاعب.';
    else if(!v('f-age') || +v('f-age')<4 || +v('f-age')>18) msg = 'العمر لازم يكون بين ٤ و ١٨ سنة.';
    else if(!v('f-branch')) msg = 'اختر الفرع.';
    else if(!v('f-parent')) msg = 'اكتب اسم ولي الأمر.';
    else if(!/^05\d{8}$/.test(toLatin(v('f-phone')))) msg = 'رقم الجوال لازم يبدأ بـ 05 ويتكون من ١٠ أرقام.';
    else if(!$('f-consent').checked) msg = 'لازم موافقة ولي الأمر عشان نكمل التسجيل.';
    if(msg){ $('formErr').textContent = msg; $('formErr').hidden = false; return; }
    DB.pending.unshift({n:v('f-name'), a:+v('f-age'), b:v('f-branch'), parent:v('f-parent'), phone:toLatin(v('f-phone')), w:'الآن'});
    e.target.hidden = true;
    $('regDone').innerHTML = `<strong>وصلنا طلبك.</strong><br>تسجيل ${esc(v('f-name'))} في فرع ${esc(v('f-branch'))}.<br><span class="label">في النموذج: سجّل دخول كـ "مدير الأكاديمية" وبتلقى الطلب في اللوحة.</span>`;
    $('regDone').hidden = false;
  });

  // parent
  on('consentGo','click', () => { if (!$('consentChk').checked) { $('consentErr').hidden = false; return; } DB.parents[me.phone].consent = true; DB.parents[me.phone].honor = $('honorChk').checked; render(); });
  on('honorToggle','change', e => { DB.parents[me.phone].honor = e.target.checked; });
  $('app').querySelectorAll('[data-kid]').forEach(b => b.onclick = () => { kidSel = b.dataset.kid; payDone = ''; paySheet = false; render(); });
  on('payBtn','click', () => { paySheet = true; payItems = {renew:true, uniform:false, socks:false}; payMethod = 'Apple Pay'; render(); });
  on('payCancel','click', () => { paySheet = false; render(); });
  $('app').querySelectorAll('[data-item]').forEach(c => c.onchange = () => { payItems[c.dataset.item] = c.checked; render(); });
  $('app').querySelectorAll('[data-method]').forEach(b => b.onclick = () => { payMethod = b.dataset.method; render(); });
  on('rcpt','change', e => { const f = e.target.files[0]; $('rcptName').textContent = f ? f.name : 'ما تم إرفاق إيصال'; });
  on('payGo','click', () => {
    const k = DB.players.find(x => x.id === kidSel), items = ITEMS.filter(([key]) => payItems[key]).map(([,l]) => l);
    if (payItems.uniform) { const i = items.indexOf('بدلة'); items[i] = `بدلة (${$('uSize').value})`; }
    const amount = payTotal(), id = Math.max(...DB.payments.map(x=>x.id)) + 1;
    if (payMethod === 'تحويل بنكي') {
      const f = $('rcpt').files[0];
      if (!f) { $('payErr').textContent = 'أرفق صورة إيصال التحويل عشان الإدارة تقدر تتأكد.'; $('payErr').hidden = false; return; }
      DB.payments.unshift({id, pid:k.id, items, amount, method:'تحويل بنكي', status:'بانتظار التأكيد', by:'ولي الأمر', w:'الآن', receipt:f.name});
      payDone = `<strong>وصل إيصال التحويل.</strong><br>الإدارة بتراجعه، ويوصلك إشعار بعد التأكيد.`;
    } else if (payMethod === 'كاش في الفرع') {
      const code = String(1000 + Math.floor(Math.random()*9000));
      DB.payments.unshift({id, pid:k.id, items, amount, method:'كاش', status:'بانتظار الدفع', by:'ولي الأمر', w:'الآن', code});
      payDone = '';
    } else {

    {'اسم اللاعب الثلاثي':'عمار خالد','الفرع':'الشرق','الفئة':'تحت ١٦','اسم ولي الأمر':'خالد','جوال ولي الأمر':'055333'},
    {'اسم اللاعب الثلاثي':'مهند علي','الفرع':'الشاطئ','الفئة':'تحت ١٠','اسم ولي الأمر':'علي','جوال ولي الأمر':'0554445566'},
  ]));
}
function updateTransferPreview(){
  const sel = $('tTo'); if (!sel) return;
  const to = DB.coaches.find(c => c.id === sel.value), p = DB.players.find(p => p.id === transferFor);
  $('tToName').textContent = to.n;
  $('tBranchNote').textContent = p.b !== to.b ? `تنبيه: هذا المدرب في فرع ${to.b}، فبيتغير فرع اللاعب من ${p.b} إلى ${to.b}.` : '';
}
function importRows(rows){
  const ok = [], bad = [];
  rows.forEach((r, i) => {
    const name = String(r['اسم اللاعب الثلاثي'] ?? '').trim();
    if (!name || name.startsWith('مثال')) return;
    let phone = toLatin(r['جوال ولي الأمر']); if (/^5\d{8}$/.test(phone)) phone = '0' + phone;
    const branch = String(r['الفرع'] ?? '').trim(), issues = [];
    if (!/^05\d{8}$/.test(phone)) issues.push('رقم الجوال');
    if (!BRANCHES.includes(branch)) issues.push('الفرع');
    if (!String(r['اسم ولي الأمر'] ?? '').trim()) issues.push('اسم ولي الأمر');
    if (issues.length) { bad.push({row:i+2, name, issues}); return; }
    if (!DB.parents[phone]) DB.parents[phone] = {n:String(r['اسم ولي الأمر']).trim(), consent:false};
    const p = mk('x' + Date.now() + i, name, '', branch, r['الفئة'] || '', r['المركز'] || 'غير محدد', null, phone);
    p.att = 'p'; p.history = [{t:'أُضيف من ملف Excel الخاص بالفرع', w:'اليوم'}]; p.notifs = [];
    DB.players.push(p); ok.push(p);
  });
  importResult = `<div class="toast"><strong>تمت إضافة ${ar(ok.length)} ${ok.length===1?'لاعب':'لاعبين'}.</strong>${bad.length ? `<br>${ar(bad.length)} صفوف تحتاج تصحيح.` : ''}
    <div class="label">اللاعبين الجدد يظهرون في "اللاعبين" تحت فلتر "بدون مدرب". وكل ولي أمر يوصله رابط الدخول، ويوافق على سياسة الخصوصية أول ما يدخل.</div>
    ${ok.length ? '<button class="btn btn-orange btn-sm" type="button" id="toUnassigned" style="margin-top:8px">تعيين مدربين لهم</button>' : ''}</div>
    ${bad.length ? `<div class="err" style="margin-top:10px"><strong>صفوف تحتاج تصحيح:</strong>${bad.map(b=>`<div>الصف ${ar(b.row)} · ${esc(b.name)}: ${b.issues.join('، ')}</div>`).join('')}</div>` : ''}`;
  render();
  const t = $('toUnassigned'); if (t) t.onclick = () => { playerFilter = 'none'; go('players'); };
}

renderChrome(); render();
</script>
